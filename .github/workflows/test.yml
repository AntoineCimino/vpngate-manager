name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check Bash syntax
        run: bash -n vpngate-manager.sh install.sh
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
  kernel-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install integration prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 iptables openvpn openssl curl util-linux
          sudo mkdir -p /etc/netns /run/netns /dev/net
          if [ ! -c /dev/net/tun ]; then sudo mknod /dev/net/tun c 10 200; fi
          sudo unshare -Urnm true
      - name: Exercise kernel namespaces and real OpenVPN
        run: sudo python3 -m unittest discover -s tests -p 'test_netns*.py' -v
